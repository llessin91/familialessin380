<script type="module">
  // Verifica se a config foi preenchida antes de carregar Firebase
  const cfg = window.FIREBASE_CONFIG;
  const naoConfigurado = !cfg || cfg.apiKey === "SUA_API_KEY_AQUI" || !cfg.apiKey;

  if (naoConfigurado) {
    window.FIREBASE_NAO_CONFIGURADO = true;
    window.dispatchEvent(new Event('firebase-ready'));
  } else {
    try {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
      const authMod = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
      const fsMod = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');

      const app = initializeApp(cfg);
      window.fbAuth = authMod.getAuth(app);
      // Mantém usuário logado mesmo após fechar o navegador
      try {
        await authMod.setPersistence(window.fbAuth, authMod.browserLocalPersistence);
      } catch (e) { console.warn('persistence:', e); }
      window.fbDb = fsMod.getFirestore(app);
      window.fbFns = {
        onAuthStateChanged: authMod.onAuthStateChanged,
        signInWithEmailAndPassword: authMod.signInWithEmailAndPassword,
        createUserWithEmailAndPassword: authMod.createUserWithEmailAndPassword,
        signOut: authMod.signOut,
        sendPasswordResetEmail: authMod.sendPasswordResetEmail,
        doc: fsMod.doc,
        setDoc: fsMod.setDoc,
        getDoc: fsMod.getDoc,
        onSnapshot: fsMod.onSnapshot,
        serverTimestamp: fsMod.serverTimestamp,
      };
      window.dispatchEvent(new Event('firebase-ready'));
    } catch (e) {
      console.error('Erro ao carregar Firebase:', e);
      window.FIREBASE_ERRO_CARGA = e.message || 'Erro desconhecido';
      window.dispatchEvent(new Event('firebase-ready'));
    }
  }
</script>
